<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" 
    href="{{ url_for('static', filename='style.css') }}"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }}</title>
</head>
<body>
    <nav>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('tracks_page') }}">Tracks</a>
        </div>
        <img src="{{ url_for('static', filename='images/newlogo.png') }}"
        alt="Track finder logo">
    </nav>
    <main>
        <h1>All tracks</h1>
        <p>We love tracks, just like you!<br> 
        So here are some of our favourites!</p>
        <ol> 
        {% for track in tracks %} 
            <li>
                <div>
                {{ track.name }} - {{ track.length }} km
                {% for i in range(track.stars) %}★{% endfor %} 
                {% if track.grade == "Hard" %}
                    <strong>(challenging)</strong>
                {% endif %}
                </div>
            <img src="{{ url_for('static', filename=track.image) }}" 
            alt="{{ track.name }}"> 
            </li> 
        {% endfor %} 
        </ol> 
    </main>
</body>
</html>
