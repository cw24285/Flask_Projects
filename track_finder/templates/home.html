<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" 
    href="{{ url_for('static', filename='style.css') }}"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }}</title>
</head>
<body>
    <nav>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('tracks_page') }}">Tracks</a>
        </div>
        <img src="{{ url_for('static', filename='images/newlogo.png') }}"
        alt="Track finder logo">
    </nav>
    <main>
        <h1>Track Finder</h1>
        <p>Walking tracks around Auckland.</p>
        <p>There is currently:</p>
            {% if count > 3 %} 
        <p>Plenty to choose from.</p> 
            {% else %}
        <p>Only a few for now.</p> 
            {% endif %} 
    </main>
</body>
</html>
